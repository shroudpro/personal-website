[project]
name = "personal-portfolio-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "sqlalchemy",
  "pydantic",
  "pydantic-settings",
  "uvicorn",
  "httpx",
  "psycopg[binary]",
  "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
